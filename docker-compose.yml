version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: skiservice-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=SicheresPasswort123
      - MYSQL_DATABASE=skiservice
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  skiserviceapi:
    image: ghcr.io/simonloeffler1993/skiserviceapi:latest
    container_name: skiserviceapi
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=SicheresPasswort123
      - DB_NAME=skiservice
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  kundenterminal:
    image: ghcr.io/simonloeffler1993/ski-kunden-dialog:latest
    container_name: kundenterminal
    ports:
      - "3000:3000"
    depends_on:
      - skiserviceapi
    environment:
      - BACKEND_URL=http://skiserviceapi:8000
    restart: unless-stopped

volumes:
  mariadb-data: